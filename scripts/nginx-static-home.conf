# Paste these blocks INSIDE the HTTPS server { ... } for tagirovweb.ru
# BEFORE the catch-all: location / { proxy_pass http://127.0.0.1:3000; ... }
#
# Why: phones hit http→301→https, then Next / →307→/m.html — redirect chains hang Safari.
# Serve / and light static files as 200 directly from disk.

    location = / {
        alias /var/www/digitalstudio/public/m.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /m.html {
        alias /var/www/digitalstudio/public/m.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /smoke.html {
        alias /var/www/digitalstudio/public/smoke.html;
        default_type text/html;
        charset utf-8;
    }

    location /hero/ {
        alias /var/www/digitalstudio/public/hero/;
        expires 7d;
        add_header Cache-Control "public";
    }
