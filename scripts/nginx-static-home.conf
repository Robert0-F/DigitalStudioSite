# Full HTTPS+HTTP site file for tagirovweb.ru
# Key fixes:
# - / served as static m.html (no Next redirect chain)
# - listen ... http2 (phones multiplex; one stalled image won't block HTML as badly)
# - root+try_files for / (alias on location=/ caused 500)

server {
    listen 443 ssl http2;
    server_name tagirovweb.ru www.tagirovweb.ru;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/tagirovweb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tagirovweb.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        root /var/www/digitalstudio/public;
        try_files /m.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /m.html {
        root /var/www/digitalstudio/public;
        try_files /m.html =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /smoke.html {
        root /var/www/digitalstudio/public;
        try_files /smoke.html =404;
        default_type text/html;
        charset utf-8;
    }

    location /hero/ {
        alias /var/www/digitalstudio/public/hero/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/digitalstudio/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Link;
    }
}

server {
    listen 80;
    server_name tagirovweb.ru www.tagirovweb.ru;
    return 301 https://tagirovweb.ru$request_uri;
}
